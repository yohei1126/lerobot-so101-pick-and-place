# Single Source of Truth for topics, shapes, and model I/O.
# All scripts and ROS 2 nodes should load this file.

robot:
  name: "so_arm101"
  # LeRobot robot type for follower arm (SO-101).
  lerobot_type: "so101_follower"
  dof: 6
  # Joint names match LeRobot official SO-100/101 motor names (IDs 1–6).
  joint_names:
    - "shoulder_pan"
    - "shoulder_lift"
    - "elbow_flex"
    - "wrist_flex"
    - "wrist_roll"
    - "gripper"
  # SO-101-style limits (radians). Refine after real calibration.
  joint_limits:
    shoulder_pan: [-1.9199, 1.9199]   # ±110 deg
    shoulder_lift: [-1.7453, 1.7453]  # ±100 deg
    elbow_flex: [-1.6900, 1.6900]     # ±96.83 deg
    wrist_flex: [-1.6581, 1.6581]     # ±95 deg
    wrist_roll: [-2.7438, 2.8412]     # -157.21 .. 162.79 deg
    gripper: [-0.1745, 1.7453]        # -10 .. 100 deg

cameras:
  top:
    topic: "/camera/top/image_raw"
    width: 640
    height: 480
    channels: 3
    fps: 30
  wrist:
    topic: "/camera/wrist/image_raw"
    width: 640
    height: 480
    channels: 3
    fps: 30

states:
  topic: "/joint_states"
  dim: 6
  rate_hz: 30

commands:
  topic: "/joint_commands"
  dim: 6
  rate_hz: 30

model:
  policy: "act"
  chunk_size: 30
  action_dim: 6
  vision_backbone: "resnet18"

# RobOps data-quality thresholds (Task 3 validator).
quality:
  sync_tolerance_ms: 33
  max_frame_gap_ms: 50
  min_joint_variance: 1.0e-4
