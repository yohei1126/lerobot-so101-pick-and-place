name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: port_pick_align/pyproject.toml

      - name: Install package (training + dev)
        run: pip install -e "port_pick_align/[training,dev]"

      - name: Ruff lint
        run: ruff check port_pick_align scripts

      - name: Ruff format
        run: ruff format --check port_pick_align scripts

      - name: Mypy
        working-directory: port_pick_align
        run: mypy src/port_pick_align

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: port_pick_align/pyproject.toml

      - name: Install package (training + dev)
        run: pip install -e "port_pick_align/[training,dev]"

      - name: Unit tests
        working-directory: port_pick_align
        run: pytest -m unit -q

  integration:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: port_pick_align/pyproject.toml

      - name: Install package (training + dev)
        run: pip install -e "port_pick_align/[training,dev]"

      - name: Integration tests
        working-directory: port_pick_align
        run: pytest -m integration -q

      - name: Upload training metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: act-integration-metrics
          path: port_pick_align/**/training_metrics.json
          if-no-files-found: ignore
