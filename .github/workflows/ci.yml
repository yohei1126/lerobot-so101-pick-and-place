name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pai_final/pyproject.toml

      - name: Install package (training + dev)
        run: pip install -e "pai_final/[training,dev]"

      - name: Ruff lint
        run: ruff check pai_final scripts

      - name: Ruff format
        run: ruff format --check pai_final scripts

      - name: Mypy
        working-directory: pai_final
        run: mypy src/pai_final

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pai_final/pyproject.toml

      - name: Install package (training + dev)
        run: pip install -e "pai_final/[training,dev]"

      - name: Unit tests
        working-directory: pai_final
        run: pytest -m unit -q

  integration:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pai_final/pyproject.toml

      - name: Install package (training + dev)
        run: pip install -e "pai_final/[training,dev]"

      - name: Integration tests
        working-directory: pai_final
        run: pytest -m integration -q

      - name: Upload training metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act-integration-metrics
          path: pai_final/**/training_metrics.json
          if-no-files-found: ignore
