[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "port-pick-align"
version = "0.1.0"
description = "Physical AI Applied1 final assignment — RobOps / ACT pipeline"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "rosbags>=0.10",
]

[project.optional-dependencies]
training = [
  "lerobot[dataset]==0.6.1",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "Pillow>=10.0",
]
feetech = [
  "lerobot[feetech]==0.6.1",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "unit: fast unit tests without full training",
  "integration: end-to-end synthetic ACT pipeline smoke",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "../scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["port_pick_align"]
